# The bootstrap manifest lists the charts `nvkectl bootstrap site` fetches and
# installs with Helm, and the images the bootstrap runs. nvkectl embeds this
# file. `nvkectl get bootstrap-manifest` prints it.
#
# nvkectl installs each chart at the version listed here. The digests are a
# record for whoever mirrors these artifacts. The bootstrap does not verify
# them.
#
# Two kinds of image entries: images the bootstrap pulls, with a digest; and
# the two images you build, with the default tag `make -C cli images` gives
# them and no digest. The --nvke-controller-image and --provisioned-provider-image flags,
# or NVKECTL_NVKE_CONTROLLER_IMAGE and NVKECTL_CAPI_PROVISIONED_IMAGE, replace those two.
#
# Not listed:
# - The controller chart, the Postgres chart, the provisioned provider's
#   manifest and the CAPNICo manifest. They ship inside nvkectl.
# - The components `clusterctl init` installs: Cluster API core, the kubeadm
#   providers and cert-manager. With infra.nico.managed, cert-manager is
#   listed below: the bootstrap installs it first, and clusterctl keeps it.
# - The kindest/node image kind boots.
#
# This file is hand-authored. A later check compares it to what the charts
# render.

components:
  # Upstream release. controller/Tiltfile pins the same version as
  # CHART_VERSION_TEMPORAL; keep the two in step.
  temporal:
    chart:
      repo: https://go.temporal.io/helm-charts
      name: temporal
      version: "0.74.0"
      sha256: 14a8efe1cc92c91befac151db91f20f9a13962788e9d710c86655add6d966d37
    images:
      server:
        ref: docker.io/temporalio/server:1.30.3
        digest: sha256:a3d0f727caad0ecca5dc6e94766135aab448551f2c6c0d33d3c67576458e6a0d
      admin-tools:
        ref: docker.io/temporalio/admin-tools:1.30.3
        digest: sha256:2c2272b008f1af295b3719963e6feeef64f838d1105d895cf6acfcf96dd31741
      ui:
        ref: docker.io/temporalio/ui:2.48.1
        digest: sha256:edb5dd1b3e0ddb35611939dde9b573533afd6fbafbbf077b73c7131a30ca91ff

  # The Postgres chart ships inside nvkectl, so it has no chart entry. The
  # image is an upstream release.
  postgresql:
    images:
      postgres:
        ref: docker.io/library/postgres:18.6
        digest: sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941

  # Upstream release.
  spire-crds:
    chart:
      repo: https://spiffe.github.io/helm-charts-hardened/
      name: spire-crds
      version: "0.6.1"
      sha256: ce982e63fc375e392b014fc99e621a55442ab886052413e9bb052f72d66580a8

  # Upstream release. tpm-attestor is pulled only when the site spec lists TPM
  # thumbprints, or with infra.provider nico, whose nodes' keys CWE adds to the
  # allowlist as CAPNICo allocates them.
  spire:
    chart:
      repo: https://spiffe.github.io/helm-charts-hardened/
      name: spire
      version: "0.30.1"
      sha256: 7c32126bb1909076cdf9fd0419dbf9e5b012f152bb09a96a4259917d70581fac
    images:
      server:
        ref: ghcr.io/spiffe/spire-server:1.15.3
        digest: sha256:4082f30d3e0ddc4000a171392c4ea174345ee44d161ee917c70b97b2ecfba141
      agent:
        ref: ghcr.io/spiffe/spire-agent:1.15.3
        digest: sha256:41b0dcd8b258a69db9e2768292a060766fb76fd866e4bc925849981ea1b825ff
      controller-manager:
        ref: ghcr.io/spiffe/spire-controller-manager:0.7.0
        digest: sha256:d7b9e710f5428ea25daa35a07083fe517ed70c23df902d21c54a0f444455a84b
      csi-driver:
        ref: ghcr.io/spiffe/spiffe-csi-driver:0.2.7
        digest: sha256:9dfe4f0caff096164fd921aa7f15319804df2fc0325f1d90bc793ef3256ab1cd
      csi-node-driver-registrar:
        ref: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.15.0
        digest: sha256:11f199f6bec47403b03cb49c79a41f445884b213b382582a60710b8c6fdc316a
      busybox:
        ref: docker.io/library/busybox:1.37.0-uclibc
        digest: sha256:8d7b1636e974e0adfd8d945955fca609304f0a56c18799dfd032d6e661382d84
      # The chart pins this image by digest. The tag is a name only.
      bash:
        ref: cgr.dev/chainguard/bash:latest
        digest: sha256:90041f375e30f41aa7e0390075d8a69dc61900771d52fa98d63ee5d03d866a58
      tpm-attestor:
        ref: ghcr.io/spiffe/spire-tpm-plugin-tpm-attestor-server:v1.9.0
        digest: sha256:9d3c69f9a9a59b274e7d6d9f8e75d89691d7d9204f2063d7917685a17b8828dc

  # Built by you from controller/Dockerfile. The ref below is the default:
  # the tag `make -C cli images` builds, side-loaded from the local image
  # store. --nvke-controller-image or NVKECTL_NVKE_CONTROLLER_IMAGE overrides it. The controller chart ships inside
  # nvkectl, so there is no chart entry.
  controller:
    images:
      controller:
        ref: nke-controller:latest

  # Built by you from cluster-api-provider-provisioned/Dockerfile. The ref
  # below is the default: the tag `make -C cli images` builds, side-loaded.
  # --provisioned-provider-image or NVKECTL_CAPI_PROVISIONED_IMAGE overrides it. Its manifest ships inside
  # nvkectl.
  cluster-api-provider-provisioned:
    images:
      manager:
        ref: cluster-api-provider-provisioned:latest

  # Pulled only with `infra.provider: nico`. An upstream release: the image the
  # embedded CAPNICo manifest names by tag. The install runs the digest below
  # instead, so a retagged image does not change what runs; --release replaces
  # it for one run with the capnico-controller digest of an NVKR release. The
  # manifest ships inside nvkectl, so there is no chart entry. The digest is
  # the multi-architecture index's.
  cluster-api-provider-nico:
    images:
      controller:
        ref: ghcr.io/dsx-ai-factory/cluster-api-provider-nico/controller:v0.1.0
        digest: sha256:4b6db5ce0b7f9e29f9c5257c4dc4831d23d6ff130790580d820dffb08b26d24c

  # Installed only with infra.nico.managed. NICo publishes no charts, so they
  # come from the release's source archive, which the bootstrap checks against
  # the sha256 below. NICo's own images come from a registry you supply.
  nico:
    source:
      url: https://github.com/NVIDIA/infra-controller/archive/refs/tags/v2.2.2.tar.gz
      sha256: bc966ae60121f5cdf91647e28713f2d3f844cebd6f7891ce5ae8616b2a395ee5

  # Upstream releases, at the versions NICo v2.2.2's helmfile pins. Installed
  # only with infra.nico.managed.
  postgres-operator:
    chart:
      repo: https://opensource.zalando.com/postgres-operator/charts/postgres-operator
      name: postgres-operator
      version: "1.11.0"
      sha256: 3914b5e117bda0834f05c9207f007e2ac372864cf6e86dcc2e1362bbe46c14d9
  vault:
    chart:
      repo: https://helm.releases.hashicorp.com
      name: vault
      version: "0.25.0"
      sha256: 7d971d699487cb3dfcb8c5de669f0a123b7f7e5e97d20fc5ec04584fe29fc3e4
  external-secrets:
    chart:
      repo: https://charts.external-secrets.io
      name: external-secrets
      version: "0.14.3"
      sha256: 5e2c5bf1fdb7e875289fc36abe8064ceb1b1aa7021b3cf06007e8bd2b0b5754b
  # Installed only with infra.nico.managed, before NICo, which needs it. The
  # version `clusterctl init` installs, CERT_MANAGER_VERSION in
  # make/tool-versions.mk: keep the two in step.
  cert-manager:
    chart:
      repo: https://charts.jetstack.io
      name: cert-manager
      version: "v1.21.1"
      sha256: c27101f3f3e2349fb4a9e704316105bf7b52ad73b8c8257d3498ef7f2f6a4adc
  # Installed only on the site cluster of infra.nico.managed, where it gives
  # NICo's services their fixed addresses. The site's kube-vip announces only
  # the control-plane address.
  metallb:
    chart:
      repo: https://metallb.github.io/metallb
      name: metallb
      version: "0.14.5"
      sha256: 12e8d6a6ef2bf0d6450c10fba55c94282ef2d3559f78d2fbf626000d13baa9ef
